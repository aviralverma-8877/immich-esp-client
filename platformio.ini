; Immich photo frame firmware for the "ESP32 RJ9 Adapter" board
; (ESP32-WROOM-32 4MB, ST7789 240x320 panel + XPT2046 touch CS on a shared SPI bus)

[platformio]
default_envs = immich-frame

[env:immich-frame]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ 7.2.1

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"0.2.0\"
    ; ---- TFT_eSPI configuration (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=25
    -DTFT_DC=26
    -DTFT_RST=27
    -DTOUCH_CS=13
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=24000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
build_unflags = -std=gnu++11

; Clean build for the browser web flasher (docs/, served by GitHub Pages):
; ignores include/secrets.h and writes docs/firmware/immich-frame.bin.
;   pio run -e release
[env:release]
extends = env:immich-frame
build_flags =
    ${env:immich-frame.build_flags}
    -DIMMICH_FRAME_RELEASE=1
extra_scripts = post:scripts/merge_bin.py
