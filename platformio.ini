; Immich photo frame firmware. One environment per board, plus a clean
; release build of each for the browser web flasher (docs/, GitHub Pages):
;
;   immich-frame      ESP32 RJ9 Adapter: ESP32-WROOM-32 4MB, ST7789 240x320,
;                     XPT2046 touch CS on a shared SPI bus
;   e32r35t           Hosyond / LCDWiki 3.5" ESP32-32E: ST7796U 320x480,
;                     XPT2046 touch, microSD, LiPo charger
;
;   pio run -e release-rj9 -e release-e32r35t   rebuild both web-flasher images

[platformio]
default_envs = immich-frame

[env:immich-frame]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800  ; 921600 gives serial noise on this board's CH340

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    bblanchon/ArduinoJson @ 7.2.1

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"0.4.0\"
    ; ---- TFT_eSPI configuration (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=25
    -DTFT_DC=26
    -DTFT_RST=27
    -DTOUCH_CS=13
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=24000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
build_unflags = -std=gnu++11

; Hosyond / LCDWiki 3.5" ESP32-32E display (E32R35T): ESP32-WROOM-32E 4MB,
; ST7796U 320x480 on HSPI with XPT2046 touch on the same bus, CH340 USB.
;   pio run -e e32r35t -t upload
[env:e32r35t]
extends = env:immich-frame
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"0.4.0\"
    -DBOARD_E32R35T=1
    ; ---- TFT_eSPI configuration (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_RGB_ORDER=TFT_BGR
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1          ; tied to EN
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33         ; touch IRQ is IO36 (unused; pressure is polled)
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Clean builds for the browser web flasher (docs/, served by GitHub Pages):
; they ignore include/secrets.h, and scripts/merge_bin.py writes
; docs/firmware/<custom_web_id>.bin and docs/manifest-<custom_web_id>.json.
[env:release-rj9]
extends = env:immich-frame
build_flags =
    ${env:immich-frame.build_flags}
    -DIMMICH_FRAME_RELEASE=1
extra_scripts = post:scripts/merge_bin.py
custom_web_id = rj9
custom_web_name = Immich Frame for the ESP32 RJ9 Adapter

[env:release-e32r35t]
extends = env:e32r35t
build_flags =
    ${env:e32r35t.build_flags}
    -DIMMICH_FRAME_RELEASE=1
extra_scripts = post:scripts/merge_bin.py
custom_web_id = e32r35t
custom_web_name = Immich Frame for the Hosyond 3.5" ESP32 display
